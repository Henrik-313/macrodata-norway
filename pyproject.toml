[project]
name = "macrodata-norway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "henrik-db",
    "httpx>=0.28.1",
    "notebook>=7.5.6",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.49",
    "typer>=0.26.7",
]

[tool.uv.sources]
henrik-db = { path = "../python-libs/henrik-db", editable = true }

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macrodata_norway"]

[project.scripts]
macrodata = "macrodata_norway.cli:app"